services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Mount source over the image's /app so uvicorn --reload picks up edits.
      - ./backend:/app
      # Named volume persists FastF1's downloaded session data across restarts.
      - fastf1cache:/app/.fastf1cache
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      # Anonymous volumes shadow these paths so the container keeps its own
      # node_modules/.next (the host's are a different OS/arch).
      - /app/node_modules
      - /app/.next

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  fastf1cache:

# MongoDB is external (Atlas free tier) — no local service needed.
